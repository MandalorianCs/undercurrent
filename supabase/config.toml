# Конфигурация Supabase CLI.
#
# Нужна для `supabase functions deploy` — без неё CLI не считает каталог
# проектом и ищет функции относительно текущей папки. Именно так и вышло
# в первый раз: команда запущена уровнем выше, и путь не сошёлся.

project_id = "undercurrent"

[functions.companion]
# Функцию вызывает бот служебным ключом и приложение — пользовательским.
# Проверку пользовательского токена оставляем включённой: она отсекает
# анонимные запросы из интернета, а служебный ключ проходит её сам.
verify_jwt = true
